name: Ruby

on:
  push:
    branches: [ main, master, 'debloat/**', 'ui/**' ]
  pull_request:
    branches: [ '*' ]

env:
    OPAL_PREFORK_DISABLE: "true"

jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - name: Set up Ruby 3.2
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2
    - name: Bundler
      run: |
        gem install bundler
        bundle install --jobs 4 --retry 3
    # RuboCop still fails the job on the baseline offenses, but the build and
    # specs run anyway so a lint failure does not hide test results.
    - name: RuboCop
      id: rubocop
      run: |
        bundle exec rake rubocop
    - name: Opal
      id: opal
      if: success() || steps.rubocop.outcome == 'failure'
      run: |
        bundle exec rake compile_all
    - name: RSpec
      if: ${{ !cancelled() && steps.opal.outcome == 'success' }}
      run: |
        bundle exec rake spec_parallel
