# nginx for the self-hosted copy (docker-compose.selfhost.yml).
# Plain HTTP on port 80 inside the container: HTTPS is handled in front of it
# by the Cloudflare Tunnel, so no certificates live here.

limit_req_zone $binary_remote_addr zone=rack:10m rate=5r/s;

upstream rackserver {
  server rack:9292;
}

server {
  listen 80 default_server;
  server_name _;

  root /public;

  # Cloudflare passes the visitor's IP in this header
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 0.0.0.0/0;

  gzip on;
  gzip_types text/plain application/json image/svg+xml;

  location ^~ /assets/ {
    access_log off;
    gzip_static on;
    expires -1;
  }

  location ^~ /pinned/ {
    access_log off;
    gzip_static on;
    expires -1;
  }

  location ~ ^/(icons|images|logos|fixtures)/ {
    access_log off;
    expires 1d;
    add_header Cache-Control public;
  }

  location ~ \.(xml|txt|png|ico|webmanifest)$ {
    access_log off;
    expires 1d;
    add_header Cache-Control public;
    try_files $uri =404;
  }

  location /message-bus/ {
    proxy_pass http://rackserver;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host            $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    limit_req zone=rack burst=20 nodelay;
    proxy_pass http://rackserver;
    proxy_redirect off;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60;
  }
}
